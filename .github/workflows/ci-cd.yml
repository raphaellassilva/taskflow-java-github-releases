name: TaskFlow CI-CD

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar
        run: mvn --batch-mode clean verify

      - name: Publicar JAR no GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TaskFlow v1.0.${{ github.run_number }}
          body: |
            Versão do TaskFlow publicada automaticamente pelo GitHub Actions.
            Build e testes automatizados aprovados na branch main.
          files: target/taskflow.jar
          generate_release_notes: true
